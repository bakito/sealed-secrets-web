name: end-2-end Helm Chart Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🖼 Build image
        run: ./testdata/e2e/image-01-build-and-save.sh

      - name: 📦 Upload image tar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tar
          path: /tmp/image.tar
          retention-days: 1

  e2e:
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # https://hub.docker.com/r/kindest/node/tags
        k8s_version: ["v1.35.8", "v1.36.4", "v1.37.0"]
        format: [ "yaml", "json" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind with registry
        uses: bakito/kind-with-registry-action@b13dc5fd599a5c774e7ca721d6e7a34f7269d2d8 # v1.0.1
        with:
          kind_cluster_name: e2e
          node_image: kindest/node:${{ matrix.k8s_version }}
          kubectl_version: ${{ matrix.k8s_version }}
          debug: false

      - name: 📥 Download image tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: /tmp

      - name: 🖼 Load image
        run: ./testdata/e2e/image-02-load-and-push.sh

      - name: ⚙️ Check Chart with Chainsaw
        run: ./testdata/e2e/chainsaw/run.sh

      - name: Install sealed-secrets
        run: |
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace sealed-secrets \
            --create-namespace \
            --wait=watcher

      - name: 🏠 Install sealed-secrets-web with ${{ matrix.format }} format In-Cluster
        run: ./testdata/e2e/installSealedSecretsWebChart.sh ${{ matrix.format }} ""

      - name: 🏠 Run Tests In-Cluster
        id: run_tests_in_cluster
        # continue on error to show logs
        continue-on-error: true
        working-directory: testdata/e2e
        run: ./runTests.sh

      - name: 🏠 Print logs In-Cluster
        run: |
          echo '🏠 Pod logs (${{ matrix.format }} format In-Cluster)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          POD_NAME=$(kubectl get pod -n sealed-secrets-web -l app.kubernetes.io/instance=sealed-secrets-web  -o name)
          kubectl logs -n sealed-secrets-web ${POD_NAME} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🏠 Fail if 'Run Tests In-Cluster' failed
        if: steps.run_tests_in_cluster.outcome=='failure'
        run: |
          echo "Step 'Run Tests In-Cluster' failed: Check 'Run Tests In-Cluster' and 'Print logs In-Cluster' as well as the job summary for errors"
          exit 1

      - name: 🔐 Install sealed-secrets-web with ${{ matrix.format }} format and cert URL
        run: |
          helm delete sealed-secrets-web --namespace sealed-secrets-web
          ./testdata/e2e/installSealedSecretsWebChart.sh ${{ matrix.format }} http://sealed-secrets.sealed-secrets.svc:8080/v1/cert.pem

      - name: 🔐 Run Tests Cert-URL
        id: run_tests_certURL
        # continue on error to show logs
        continue-on-error: true
        working-directory: testdata/e2e
        run: ./runTests.sh skip-validate

      - name: 🔐 Print logs Cert-URL
        run: |
          echo '🔐 Pod logs (${{ matrix.format }} format and Cert-URL)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          POD_NAME=$(kubectl get pod -n sealed-secrets-web -l app.kubernetes.io/instance=sealed-secrets-web  -o name)
          kubectl logs -n sealed-secrets-web ${POD_NAME} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🔐 Fail if 'Run Tests Cert-URL' failed
        if: steps.run_tests_certURL.outcome=='failure'
        run: |
          echo "Step 'Run Tests Cert-URL' failed: Check 'Run Tests Cert-URL' and 'Print logsCert-URL' as well as the job summary for errors"
          exit 1

  e2e-multi-key:
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s_version: ["v1.35.8", "v1.36.4", "v1.37.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind with registry
        uses: bakito/kind-with-registry-action@b13dc5fd599a5c774e7ca721d6e7a34f7269d2d8 # v1.0.1
        with:
          kind_cluster_name: e2e
          node_image: kindest/node:${{ matrix.k8s_version }}
          kubectl_version: ${{ matrix.k8s_version }}
          debug: false

      - name: 📥 Download image tar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: /tmp

      - name: 🖼 Load image
        run: ./testdata/e2e/image-02-load-and-push.sh

      - name: ⚙️ Check Chart with Chainsaw
        run: ./testdata/e2e/chainsaw/run.sh

      - name: Install sealed-secrets primary
        run: |
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace sealed-secrets \
            --create-namespace \
            --wait=watcher

      - name: Install sealed-secrets secondary
        run: |
          helm install sealed-secrets-secondary sealed-secrets/sealed-secrets \
            --namespace sealed-secrets-secondary \
            --create-namespace \
            --wait=watcher \
            --skip-crds

      - name: 🔑 Create multi-key config
        run: |
          cat > /tmp/multi-key-config.yaml << 'EOF'
          sealedSecrets:
            namespace: sealed-secrets
            serviceName: sealed-secrets
          sealedSecretsKeys:
            - label: "primary"
              namespace: sealed-secrets
              service: sealed-secrets
            - label: "secondary"
              namespace: sealed-secrets-secondary
              service: sealed-secrets
          web:
            port: 8080
          disableLoadSecrets: true
          EOF
          kubectl create configmap sealed-secrets-web-config \
            --namespace sealed-secrets-web \
            --from-file=config.yaml=/tmp/multi-key-config.yaml \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 🔑 Install sealed-secrets-web with multi-key config
        run: |
          helm upgrade --install sealed-secrets-web chart \
            --namespace sealed-secrets-web \
            --create-namespace \
            -f testdata/e2e/multi-key-values.yaml \
            --wait=watcher \
            --timeout=1m

      - name: 🏠 Run Multi-Key Tests
        id: run_tests_multi_key
        continue-on-error: true
        working-directory: testdata/e2e
        run: ./runTestMultiKey.sh

      - name: 🏠 Print logs Multi-Key
        run: |
          echo '🔑 Pod logs (Multi-Key)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          POD_NAME=$(kubectl get pod -n sealed-secrets-web -l app.kubernetes.io/instance=sealed-secrets-web  -o name)
          kubectl logs -n sealed-secrets-web ${POD_NAME} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 🔑 Fail if Multi-Key Tests failed
        if: steps.run_tests_multi_key.outcome=='failure'
        run: |
          echo "Step 'Run Multi-Key Tests' failed: Check 'Run Multi-Key Tests' and 'Print logs Multi-Key' as well as the job summary for errors"
          exit 1
