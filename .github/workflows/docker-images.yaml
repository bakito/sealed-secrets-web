name: Build images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  id-token: write # required for keyless signing via GitHub OIDC

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        run: echo "curr_date=$(date --utc +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to ghcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Quay
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
        if: ${{ github.event.release.tag_name != '' || github.ref == 'refs/heads/main' }}

      - name: Build images ${{github.event.release.tag_name }}
        id: docker_build_release
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: ${{ github.event.release.tag_name != '' }}
        with:
          push: true
          pull: true
          tags: ghcr.io/bakito/sealed-secrets-web:latest,ghcr.io/bakito/sealed-secrets-web:${{ github.event.release.tag_name }},quay.io/bakito/sealed-secrets-web:latest,quay.io/bakito/sealed-secrets-web:${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            BUILD=${{ env.curr_date }}

      - name: Sign release images
        if: ${{ github.event.release.tag_name != '' }}
        env:
          DIGEST: ${{ steps.docker_build_release.outputs.digest }}
        run: |
          for IMAGE in \
            ghcr.io/bakito/sealed-secrets-web \
            quay.io/bakito/sealed-secrets-web; do
            cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          done

      - name: Build images
        id: docker_build_main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: ${{ github.event.release.tag_name == '' }}
        with:
          push: ${{ github.ref == 'refs/heads/main' }}
          pull: true
          tags: ghcr.io/bakito/sealed-secrets-web:main,quay.io/bakito/sealed-secrets-web:main
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            VERSION=main
            BUILD=${{ env.curr_date }}

      - name: Sign main images
        if: ${{ github.event.release.tag_name == '' && github.ref == 'refs/heads/main' }}
        env:
          DIGEST: ${{ steps.docker_build_main.outputs.digest }}
        run: |
          for IMAGE in \
            ghcr.io/bakito/sealed-secrets-web \
            quay.io/bakito/sealed-secrets-web; do
            cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          done

      - name: Image digest
        run: echo ${{ steps.docker_build_release.outputs.digest }}${{ steps.docker_build_main.outputs.digest }}
